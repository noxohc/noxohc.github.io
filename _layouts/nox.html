<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Nox</title>

  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #e8e8e8;
      font-family: 'Marcellus', 'Malgun Gothic', serif;
    }

    .nox-page {
      position: relative;
      width: calc(100% - 60px);
      min-height: calc(100vh - 60px);
      margin: 30px auto;
      padding: 0 5% 70px;
      border: 1px solid rgba(210,210,210,0.38);
      border-radius: 22px;
    }

    /* 상단 메뉴 */
    .nox-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      border-bottom: 1px solid #353535;
      gap: 24px;
    }

    .nox-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 37px;
      font-weight: 500;
      color: #f0f0f0;
      text-decoration: none;
      white-space: nowrap;
    }

    .nox-links {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }

    .nox-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1.2px;
    }

    .nox-links a:hover {
      color: #fff;
    }

    /* 중앙 달과 제목 */
    .nox-hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 15px 20px 35px;
    }

    .nox-moon {
      display: block;
      width: 380px;
      max-width: 85%;
      height: auto;
      margin: 0 auto -15px;
      filter: grayscale(1);
    }

    .nox-title {
      position: relative;
      z-index: 3;
      margin: -45px 0 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      font-weight: 500;
      color: #f0f0f0;
    }

    .nox-subtitle {
      margin: 20px 0 0;
      color: #aaa;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .nox-hero::after {
      content: "✦";
      display: block;
      margin: 12px auto 0;
      font-size: 17px;
      color: #e8e8e8;
    }

    /* 페이지 콘텐츠 */
    .nox-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(250px, 1fr);
      gap: 45px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .nox-main {
      min-width: 0;
    }

    .nox-side {
      padding-left: 30px;
      border-left: 1px solid rgba(190,190,190,0.22);
    }

    .nox-side h3 {
      font-family: 'Marcellus', serif;
      font-size: 17px;
      font-weight: normal;
    }

    .nox-side p {
      color: #999;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 800px) {
      .nox-page {
        width: calc(100% - 24px);
        margin: 12px auto;
        padding: 0 20px 40px;
      }

      .nox-navbar {
        flex-direction: column;
        padding: 18px 0;
      }

      .nox-links {
        justify-content: center;
        gap: 16px;
      }

      .nox-content {
        grid-template-columns: 1fr;
      }

      .nox-side {
        border-left: none;
        border-top: 1px solid #353535;
        padding: 25px 0 0;
      }
    }
    
      /* Categories 목록 */
      .nox-category-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .nox-category-item {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 78px;
        padding: 20px 24px;
        border: 1px solid rgba(210,210,210,0.25);
        border-radius: 10px;
        color: #e8e8e8;
        text-decoration: none;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .nox-category-item:hover {
        border-color: rgba(230,230,230,0.65);
        background: rgba(255,255,255,0.035);
      }
      
      .nox-category-sparkle {
        color: #d8d8d8;
        font-size: 19px;
      }
      
      .nox-category-name {
        flex: 1;
        font-family: 'Marcellus', serif;
        font-size: 19px;
      }
      
      .nox-category-count {
        color: #888;
        font-size: 12px;
      }
      
      .nox-category-arrow {
        color: #bbb;
        font-size: 19px;
      }

  </style>
</head>

<body>
  <div class="nox-page">

    <nav class="nox-navbar">
      <a class="nox-brand" href="{{ '/' | relative_url }}">✦ Nox</a>

      <div class="nox-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
        <a href="{{ '/tags/' | relative_url }}">Tags</a>
        <a href="{{ '/archives/' | relative_url }}">Archives</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>
    </nav>

    <section class="nox-hero">
      <img
        class="nox-moon"
        src="{{ '/assets/img/nox_moon.png' | relative_url }}"
        alt="Nox Moon"
      >

      <h1 class="nox-title">{{ page.title }}</h1>

      <p class="nox-subtitle">
        SECURITY · SYSTEM · RESEARCH · NOTES
      </p>
    </section>

    <div class="nox-content">

      <main class="nox-main">
        {{ content }}
      </main>

      <aside class="nox-side">
        <h3>✦ About</h3>
        <p>Exploring cybersecurity and development.</p>
      </aside>

    </div>

  </div>
</body>
</html>
